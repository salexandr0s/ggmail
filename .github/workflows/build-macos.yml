name: Build ggmail for Apple silicon

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run lint
      - run: bun run types:ci
      - run: bun run test
      - run: bun run build:mac:local
      - name: Archive the verified app
        run: ditto -c -k --keepParent dist/mac-arm64/ggmail.app dist/ggmail-mac-arm64-ci.zip
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ggmail-mac-arm64-ci
          path: dist/ggmail-mac-arm64-ci.zip
          if-no-files-found: error
